name: BuildingManagement safe regression

on:
  pull_request:
    branches:
      - wip/phase-2g2
  push:
    branches:
      - wip/phase-2g2

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-tests:
    name: Isolated .NET 10 tests + source safety gates
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub checkout uses a detached HEAD for PR merge commits. The
      # source-only safety scripts require an explicitly named LOCAL branch.
      # This changes only the ephemeral CI checkout, never the remote repo.
      - name: Establish local safety branch
        shell: pwsh
        run: git switch -C wip/phase-2g2

      - name: Parse Phase 2H acceptance PowerShell without executing it
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          $runner = (Resolve-Path '.\\etc\\scripts\\verify-phase-2h-financial-foundations.ps1').Path
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $runner, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            foreach ($parseError in $parseErrors) { Write-Host $parseError }
            throw "Phase 2H PowerShell runner has $($parseErrors.Count) syntax error(s)."
          }

      - name: Install .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Security regression batch
        shell: pwsh
        run: |
          .\etc\scripts\verify-2g-security-batch.ps1 -Mode Full

# Intentionally excluded:
# - DbMigrator / EF migration / PostgreSQL integration tests
# - production secrets or database connections
# - deployments, billing or invoice mutation endpoints
