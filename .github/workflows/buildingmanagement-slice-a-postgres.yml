      - "modules/buildingmanagement/src/BuildingManagement.Domain/Security/IBuildingScopedWriteBoundary.cs"

permissions:
  contents: read

concurrency:
  group: membership-scratch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-postgres-grants:
    name: Disposable PostgreSQL grant SQL and concurrency probes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A NEW container is created for each job. No production credentials,
    # servers, migrations, application databases or user-supplied SQL.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ngoctrang_integration_test
          POSTGRES_USER: slice_a_ci
          POSTGRES_PASSWORD: slice_a_ephemeral_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slice_a_ci -d ngoctrang_integration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      BM_PG_TEST_CONNECTION: "Host=127.0.0.1;Port=5432;Database=ngoctrang_integration_test;Username=slice_a_ci;Password=slice_a_ephemeral_ci_only"
      BM_PG_MEMBERSHIP_CONCURRENCY_OPT_IN: I_ACCEPT_EPHEMERAL_SCHEMA
      BM_PG_SLICE_A_FULL_CHAIN_OPT_IN: CREATE_AND_DROP_RANDOM_LOCAL_SLICE_A_DATABASE
      BM_PG_SLICE_A_HTTP_OPT_IN: I_ACCEPT_DISPOSABLE_PG_STAGING_HTTP
      BM_PG_RUNTIME_ROLE_OPT_IN: I_ACCEPT_EPHEMERAL_NONOWNER_LOGIN

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Membership SQL rollback and concurrent transaction probes
        run: |
          dotnet test modules/buildingmanagement/test/BuildingManagement.PostgreSql.Tests/BuildingManagement.PostgreSql.Tests.csproj \
            --filter "FullyQualifiedName~BuildingOperatorGrantCandidatePostgreSql_Tests|FullyQualifiedName~BuildingOperatorGrantConcurrencyPostgreSql_Tests|FullyQualifiedName~SliceAGrantEfMigrationPostgreSql_Tests|FullyQualifiedName~SliceAFullChainUpgradePostgreSql_Tests" \
            --logger "console;verbosity=normal"

      - name: Full Slice B real EF migration chain in disposable PostgreSQL database
        run: |
          dotnet test modules/buildingmanagement/test/BuildingManagement.PostgreSql.Tests/BuildingManagement.PostgreSql.Tests.csproj \
            --filter "FullyQualifiedName~SliceBFullFinancialMigrationChainPostgreSql_Tests" \
            --logger "console;verbosity=normal"

      - name: Slice B staged final invoice evidence PostgreSQL rollback probes
        run: |
          dotnet test modules/buildingmanagement/test/BuildingManagement.PostgreSql.Tests/BuildingManagement.PostgreSql.Tests.csproj \
            --filter "FullyQualifiedName~SliceBFinalInvoiceEvidenceMigrationPostgreSql_Tests" \
            --logger "console;verbosity=normal"

      - name: Slice B staged payment allocation journal PostgreSQL probes
        run: |
          dotnet test modules/buildingmanagement/test/BuildingManagement.PostgreSql.Tests/BuildingManagement.PostgreSql.Tests.csproj \
            --filter "FullyQualifiedName~SliceBInvoicePaymentAllocationStagingPostgreSql_Tests" \
            --logger "console;verbosity=normal"

      - name: Slice B immutable issued-invoice ledger PostgreSQL probes
        run: |
          dotnet test modules/buildingmanagement/test/BuildingManagement.PostgreSql.Tests/BuildingManagement.PostgreSql.Tests.csproj \
            --filter "FullyQualifiedName~SliceBIssuedInvoiceLedgerPostgreSql_Tests" \
            --logger "console;verbosity=normal"

      - name: Slice B full issued-invoice and receipt reconciliation PostgreSQL chain
        run: |
          dotnet test modules/buildingmanagement/test/BuildingManagement.PostgreSql.Tests/BuildingManagement.PostgreSql.Tests.csproj \
            --filter "FullyQualifiedName~SliceBReconciliationBoundaryPostgreSql_Tests" \
            --logger "console;verbosity=normal"

      - name: Slice B approved deposit closeout PostgreSQL history probes
        run: |
          dotnet test modules/buildingmanagement/test/BuildingManagement.PostgreSql.Tests/BuildingManagement.PostgreSql.Tests.csproj \
            --filter "FullyQualifiedName~SliceBDepositCloseoutPostgreSql_Tests" \
            --logger "console;verbosity=normal"

      - name: Slice B immutable source receipts and closed-contract freeze probes
        run: |
          dotnet test modules/buildingmanagement/test/BuildingManagement.PostgreSql.Tests/BuildingManagement.PostgreSql.Tests.csproj \
            --no-restore --configuration Release \
            --filter "FullyQualifiedName~SliceBFreezeAllocatedInvoiceReceiptsPostgreSql_Tests" \
            --logger "console;verbosity=normal"

      - name: Slice B block post-closeout invoice issuance and concurrent SQL race
        run: |
          dotnet test modules/buildingmanagement/test/BuildingManagement.PostgreSql.Tests/BuildingManagement.PostgreSql.Tests.csproj \
            --no-restore --configuration Release \
            --filter "FullyQualifiedName~SliceBBlockIssuedInvoiceAfterCloseoutPostgreSql_Tests" \
            --logger "console;verbosity=normal"

      - name: Slice B refund reference uniqueness and concurrent replay guard
        run: |
          dotnet test modules/buildingmanagement/test/BuildingManagement.PostgreSql.Tests/BuildingManagement.PostgreSql.Tests.csproj \
            --no-restore --configuration Release \
            --filter "FullyQualifiedName~SliceBUniqueDepositRefundReferencesPostgreSql_Tests" \
            --logger "console;verbosity=normal"

      - name: Slice B closed contract financial terms and commit race freeze
        run: |
          dotnet test modules/buildingmanagement/test/BuildingManagement.PostgreSql.Tests/BuildingManagement.PostgreSql.Tests.csproj \
            --no-restore --configuration Release \
            --filter "FullyQualifiedName~SliceBFreezeClosedContractTermsPostgreSql_Tests" \
            --logger "console;verbosity=normal"

      - name: Slice B immutable completed move-out evidence and transaction race
        run: |
          dotnet test modules/buildingmanagement/test/BuildingManagement.PostgreSql.Tests/BuildingManagement.PostgreSql.Tests.csproj \
            --no-restore --configuration Release \
            --filter "FullyQualifiedName~SliceBFreezeClosedMoveOutRequestPostgreSql_Tests" \
            --logger "console;verbosity=normal"

      - name: Slice B deferred atomic closeout consistency at transaction commit
        run: |
          dotnet test modules/buildingmanagement/test/BuildingManagement.PostgreSql.Tests/BuildingManagement.PostgreSql.Tests.csproj \
            --no-restore --configuration Release \
            --filter "FullyQualifiedName~SliceBValidateCompletedCloseoutAtCommitPostgreSql_Tests" \
            --logger "console;verbosity=normal"

      - name: Slice B immutable signed move-out checklist and race probes
        run: |
          dotnet test modules/buildingmanagement/test/BuildingManagement.PostgreSql.Tests/BuildingManagement.PostgreSql.Tests.csproj \
            --no-restore --configuration Release \
            --filter "FullyQualifiedName~SliceBFreezeClosedMoveOutChecklistPostgreSql_Tests" \
            --logger "console;verbosity=normal"

      - name: Slice B freeze signed tenant parties and extensible evidence
        run: |
          dotnet test modules/buildingmanagement/test/BuildingManagement.PostgreSql.Tests/BuildingManagement.PostgreSql.Tests.csproj \
            --no-restore --configuration Release \
            --filter "FullyQualifiedName~SliceBFreezeClosedContractPartiesAndExtrasPostgreSql_Tests" \
            --logger "console;verbosity=normal"

      - name: Isolated PostgreSQL ABP authenticated staging HTTP
        run: |
          dotnet test test/NgocTrangHouseManagementSystem.HttpApi.Host.Tests/NgocTrangHouseManagementSystem.HttpApi.Host.Tests.csproj \
            --filter "FullyQualifiedName~SliceAStagingPostgreSqlHttp_Tests" \
            --logger "console;verbosity=normal"

# Does not start the ABP app, use EF Migrate/DbMigrator, alter runtime
# identity/grants, or connect to any real user's PostgreSQL database.
