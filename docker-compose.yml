services:

  postgres:
    image: postgres:16
    container_name: ngoctrang-postgres
    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - ngoctrang_postgres_data:/var/lib/postgresql/data

volumes:
  ngoctrang_postgres_data:
