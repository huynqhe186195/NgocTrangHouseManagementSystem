name: BuildingManagement safe regression

on:
  pull_request:
    branches:
      - wip/phase-2g2
  push:
    branches:
      - wip/phase-2g2

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-tests:
    name: Isolated .NET 10 tests + source safety gates
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub checkout uses a detached HEAD for PR merge commits. The
      # source-only safety scripts require an explicitly named LOCAL branch.
      # This changes only the ephemeral CI checkout, never the remote repo.
      - name: Establish local safety branch
        shell: pwsh
        run: git switch -C wip/phase-2g2

      - name: Parse Phase 2H acceptance PowerShell without executing it
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          foreach ($scriptPath in @(
            '.\etc\scripts\verify-phase-2h-financial-foundations.ps1',
            '.\etc\scripts\Assert-Phase2HTrx.ps1'
          )) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $scriptPath).Path, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              foreach ($parseError in $parseErrors) { Write-Host $parseError }
              throw "Phase 2H PowerShell syntax invalid in $scriptPath."
            }
          }

      - name: Probe Phase 2H TRX acceptance counter and fail-closed behavior
        shell: pwsh
        run: |
          $parser = (Resolve-Path '.\etc\scripts\Assert-Phase2HTrx.ps1').Path
          $fixture = Join-Path $env:RUNNER_TEMP 'phase2h-trx-acceptance-fixture.trx'
          function Write-Trx([int]$total, [int]$passed, [int]$failed, [int]$notExecuted) {
            $executed = $total - $notExecuted
            $xml = '<TestRun xmlns="http://microsoft.com/schemas/VisualStudio/TeamTest/2010"><ResultSummary outcome="Completed"><Counters total="{0}" executed="{1}" passed="{2}" failed="{3}" notExecuted="{4}" /></ResultSummary></TestRun>' -f $total,$executed,$passed,$failed,$notExecuted
            Set-Content -LiteralPath $fixture -Value $xml -Encoding UTF8
          }
          function Expect-Rejected([int]$expected) {
            $rejected = $false
            try { & $parser -Path $fixture -ExpectedTests $expected | Out-Null }
            catch { $rejected = $true }
            if (-not $rejected) { throw "TRX guard accepted invalid fixture for $expected cases." }
          }
          Write-Trx 160 160 0 0
          & $parser -Path $fixture -ExpectedTests 160
          Expect-Rejected 96
          Write-Trx 160 159 1 0
          Expect-Rejected 160
          Write-Trx 160 159 0 1
          Expect-Rejected 160
          Write-Trx 96 96 0 0
          & $parser -Path $fixture -ExpectedTests 96
          Set-Content -LiteralPath $fixture -Value '<bad-trx' -Encoding UTF8
          Expect-Rejected 96
          Remove-Item -LiteralPath $fixture -Force
          Expect-Rejected 96

      - name: Install .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate actual .NET 10 Windows 160-domain TRX emission
        shell: pwsh
        run: |
          $trxFile = Join-Path $env:RUNNER_TEMP 'phase2h-windows-160-domain.trx'
          Remove-Item -LiteralPath $trxFile -Force -ErrorAction SilentlyContinue
          & dotnet test .\modules\buildingmanagement\test\BuildingManagement.Domain.Tests\BuildingManagement.Domain.Tests.csproj --filter 'FullyQualifiedName~RoomChangeMidMonthRentReconciliation_Tests|FullyQualifiedName~RoomChangeDepositDifferencePreview_Tests|FullyQualifiedName~TRF_HAND|FullyQualifiedName~RoomChangeMidMonthFinancialReconciliationPacket_Tests|FullyQualifiedName~RoomChangeDayPricingRuleCandidate_Tests|FullyQualifiedName~RoomChangeOfficialSourceRentEvidenceBridge_Tests|FullyQualifiedName~RoomChangeFinalIndependentSignoffs_Tests|FullyQualifiedName~RoomChangeApprovedH2H3ExecutionPolicy_Tests|FullyQualifiedName~RoomChangeDeferredDepositDisposition_Tests|FullyQualifiedName~RoomScopedServiceTariffPolicy_Tests|FullyQualifiedName~RoomScopedServiceInvoiceSourceBinding_Tests|FullyQualifiedName~RoomChangeDepositDispositionIntent_Tests' --logger 'console;verbosity=normal' --logger 'trx;LogFileName=phase2h-windows-160-domain.trx' --results-directory $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Real Phase 2H Domain Windows tests failed.' }
          & .\etc\scripts\Assert-Phase2HTrx.ps1 -Path $trxFile -ExpectedTests 160

      - name: Security regression batch
        shell: pwsh
        run: |
          .\etc\scripts\verify-2g-security-batch.ps1 -Mode Full

# Intentionally excluded:
# - DbMigrator / EF migration / PostgreSQL integration tests
# - production secrets or database connections
# - deployments, billing or invoice mutation endpoints
