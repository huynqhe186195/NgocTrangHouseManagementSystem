name: Flutter mobile validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "mobile/ngoctrangbuilding_app/**"
      - ".github/workflows/flutter-mobile.yml"
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "mobile/ngoctrangbuilding_app/**"
      - ".github/workflows/flutter-mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile/ngoctrangbuilding_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter 3.50.0 from the official repository
        shell: bash
        run: |
          flutter_revision="ab2912035e160d9cad6306df307576da6128ebdb"
          git clone --filter=blob:none --no-checkout https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin "$flutter_revision"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$flutter_revision"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$flutter_revision"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/flutter/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" precache --no-web --no-android --no-ios --no-macos --no-windows

      - name: Verify Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test
